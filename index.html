<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>مدیریت مالی شخصی</title>
  <meta name="description" content="مدیریت مالی شخصی ساده و متن‌باز، با تقویم شمسی. تمام داده‌ها فقط روی دستگاه شما ذخیره می‌شود.">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    try {
      var t = JSON.parse(localStorage.getItem('pfm.v1') || '{}').settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1210" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مدیریت مالی">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>

    <button id="fab" class="fab" data-act="addTx" aria-label="ثبت تراکنش جدید">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>تراکنش</span>
    </button>
    <button id="fab2" class="fab fab2 hidden" data-act="addPlan" aria-label="ثبت مورد جدید">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fab2-label"></span>
    </button>

    <nav class="tabbar" aria-label="بخش‌ها">
      <button data-act="tab" data-tab="home" class="tab"><span class="ico"></span><span>خانه</span></button>
      <button data-act="tab" data-tab="reports" class="tab"><span class="ico"></span><span>گزارش</span></button>
      <button data-act="tab" data-tab="accounts" class="tab"><span class="ico"></span><span>حساب‌ها</span></button>
      <button data-act="tab" data-tab="plans" class="tab"><span class="ico"></span><span>تعهدات</span><i class="badge" hidden></i></button>
      <button data-act="tab" data-tab="settings" class="tab"><span class="ico"></span><span>تنظیمات</span></button>
    </nav>
  </div>

  <div id="search-root"></div>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>

  <script src="js/jalali.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
